name: Verify

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow reads the repository and, on a pull request,
# the list of commits that pull request contains. It holds no configured
# secrets. `pull-requests: read` is required by the secret scan and by nothing
# else; without it that step fails with GitHub 403 before scanning anything,
# which is exactly how it silently never ran until Task 28.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A full history is required for the secret scan to be meaningful.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate a human runs: formatting, lint, typechecks, Deno
      # deployment graphs, every test suite, guardrails, and a production build.
      - run: pnpm verify

      - run: pnpm check:supabase

      # A production build must refuse the development bypass.
      - run: pnpm check:production

      - run: pnpm audit --prod

      # Named for what it does. On a pull request this scans that pull
      # request's commits, and on a push to main the pushed commits; only a
      # manual or scheduled run walks the whole history. The previous name
      # claimed full history on every event, which was never true.
      - name: Scan incoming commits for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          # Auto-provisioned by GitHub, not a configured secret. The action
          # requires it to list a pull request's commits, which is why the job
          # needs `pull-requests: read` above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
