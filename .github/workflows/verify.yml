name: Verify

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository and holds no secrets.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A full history is required for the secret scan to be meaningful.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same gate a human runs: formatting, lint, typechecks, Deno
      # deployment graphs, every test suite, guardrails, and a production build.
      - run: pnpm verify

      - run: pnpm check:supabase

      # A production build must refuse the development bypass.
      - run: pnpm check:production

      - run: pnpm audit --prod

      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          # Auto-provisioned by GitHub, not a configured secret. The action
          # requires it to scan a pull request's commits; without it the job
          # fails on every PR while passing on push, which is the worst of both.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
