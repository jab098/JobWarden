packages:
  - apps/*
  - packages/*

allowBuilds:
  deno: true
  sharp: true
  unrs-resolver: true

overrides:
  postcss: 8.5.19
  # next pulls sharp for image optimisation; 0.34.x carries the libvips CVEs
  # GHSA-f88m-g3jw-g9cj. Force the patched line so `pnpm audit --prod` is clean.
  sharp: 0.35.0

minimumReleaseAgeExclude:
  - "@supabase/auth-js@2.110.7"
  - "@supabase/functions-js@2.110.7"
  - "@supabase/postgrest-js@2.110.7"
  - "@supabase/realtime-js@2.110.7"
  - "@supabase/storage-js@2.110.7"
  - "@supabase/supabase-js@2.110.7"
